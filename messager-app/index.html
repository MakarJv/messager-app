<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="src/style.css">
    <title>Messager-app</title>
</head>
<body>

<div class="container login close">
    <h2>Войти</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Пароль">
    <button id="enterBtn">Войти</button>
    <a href="#">Забыли пароль?</a>
    <a id="register" href="#">Регистрация</a>
</div>

<div class="container register close">
    <h2>Регистрация</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Пароль">
    <button>Зарегистрироваться</button>
    <a href="#">Забыли пароль?</a>
    <a id="login" href="#">Войти</a>
</div>

<div class="container chat">
    <div class="chats">

    </div>
    <div class="messager">
    <input class="message" type="text" placeholder="Введите сообщение...">
    <button id="sendBtn">Отправить</button>
    </div>
</div>

<script src="src/app.js"></script>
</body>
</html>
