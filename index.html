<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Messenger-app</title>

    <!-- Ionicons (иконки) -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Стили -->
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

<!-- ============================================================================
     1. ОКНО ВХОДА
     ============================================================================ -->
<div class="container login">
    <h2>Войти</h2>
    <input type="email" id="loginUsername" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Пароль">
    <button id="enterBtn">Войти</button>
    <a href="#">Забыли пароль?</a>
    <a id="register" href="#">Регистрация</a>
</div>

<!-- ============================================================================
     2. ОКНО РЕГИСТРАЦИИ
     ============================================================================ -->
<div class="container register close">
    <h2>Регистрация</h2>
    <input type="text" id="regUsername" placeholder="Имя">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Пароль">
    <button id="regBtn">Зарегистрироваться</button>
    <a href="#">Забыли пароль?</a>
    <a id="login" href="#">Войти</a>
</div>

<!-- ============================================================================
     3. ОСНОВНОЙ ЧАТ
     ============================================================================ -->
<div class="container chat close">

    <!-- 3.1 ЛЕВАЯ ПАНЕЛЬ (Список чатов) -->
    <!-- ЛЕВАЯ ПАНЕЛЬ: список чатов и пользователей -->
    <div id="chats">
        <!-- Верхняя панель -->
        <div class="navBar">
            <div class="menu">
                <ion-icon name="menu-outline" id="menuBtn"></ion-icon>
                <ion-icon name="close-outline" id="closeBtn" class="close"></ion-icon>
            </div>
            <div class="chats-title">Мессенджер</div>
            <div class="new-chat-btn" id="newChatBtn">
                <ion-icon name="create-outline"></ion-icon>
            </div>
        </div>

        <!-- ПОИСК ПОЛЬЗОВАТЕЛЕЙ -->
        <div class="search-box">
            <ion-icon name="search-outline"></ion-icon>
            <input type="text" id="searchInput" placeholder="Поиск пользователей...">
        </div>

        <!-- ВКЛАДКИ: Чаты / Все пользователи -->
        <div class="tabs">
            <div class="tab active" data-tab="chats">Чаты</div>
            <div class="tab" data-tab="users">Пользователи</div>
        </div>

        <!-- СПИСОК ЧАТОВ -->
        <div class="list-container" id="chatsList">
            <!-- Сюда загружаются чаты -->
            <div class="empty-state" id="emptyChats">
                <ion-icon name="chatbubbles-outline"></ion-icon>
                <span>Нет активных чатов</span>
            </div>
        </div>

        <!-- СПИСОК ПОЛЬЗОВАТЕЛЕЙ (скрыт по умолчанию) -->
        <div class="list-container hidden" id="usersListContainer">
            <!-- Сюда загружаются пользователи -->
            <div class="empty-state" id="emptyUsers">
                <ion-icon name="people-outline"></ion-icon>
                <span>Нет других пользователей</span>
            </div>
        </div>

        <!-- Нижняя панель с кнопками (ПК) -->
        <div class="desktop-footer">
            <div class="desktop-footer-item" id="profileDesktopBtn">
                <ion-icon name="person-circle-outline"></ion-icon>
                <span>Профиль</span>
            </div>
            <div class="desktop-footer-item" id="settingsDesktopBtn">
                <ion-icon name="settings-outline"></ion-icon>
                <span>Настройки</span>
            </div>
            <div class="desktop-footer-item" id="exitDesktopBtn">
                <ion-icon name="log-out-outline"></ion-icon>
                <span>Выход</span>
            </div>
        </div>
    </div>

    <!-- 3.2 ПРАВАЯ ПАНЕЛЬ (Переписка) -->
    <div id="messager">
        <!-- Верхняя панель -->
        <div class="navBar">
            <div class="menu-btn" id="menuBtnMobile">
                <ion-icon name="menu-outline"></ion-icon>
            </div>
            <div class="chat-title" id="currentChatTitle">Общий чат</div>
            <div class="profile-icon">
                <ion-icon name="person-circle-outline"></ion-icon>
            </div>
        </div>

        <!-- Область сообщений -->
        <div id="messageText"></div>

        <!-- Нижняя панель ввода -->
        <div class="input">
            <input
                    type="text"
                    id="message"
                    name="message_${Date.now()}"
                    placeholder="Введите сообщение..."
                    autocomplete="off"
            >
            <button id="sendBtn">
                <ion-icon name="send-outline"></ion-icon>
            </button>
        </div>
    </div>
</div>

<!-- ============================================================================
     4. БОКОВОЕ МЕНЮ (ДЛЯ ТЕЛЕФОНОВ)
     ============================================================================ -->
<!-- БОКОВОЕ МЕНЮ (ДЛЯ ТЕЛЕФОНОВ) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <span>Мессенджер</span>
        <button class="sidebar-close-btn" id="sidebarCloseBtn">
            <ion-icon name="close-outline" style="color: #ffffff"></ion-icon>
        </button>
    </div>

    <!-- ПОИСК В БОКОВОМ МЕНЮ -->
    <div class="sidebar-search">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" id="sidebarSearchInput" placeholder="Поиск...">
    </div>

    <!-- ВКЛАДКИ В БОКОВОМ МЕНЮ -->
    <div class="sidebar-tabs">
        <div class="sidebar-tab active" data-tab="chats">
            <ion-icon name="chatbubbles-outline"></ion-icon>
            <span>Чаты</span>
        </div>
        <div class="sidebar-tab" data-tab="users">
            <ion-icon name="people-outline"></ion-icon>
            <span>Люди</span>
        </div>
    </div>

    <!-- СПИСОК ЧАТОВ (мобильная версия) -->
    <div class="sidebar-list" id="sidebarChatsList">
        <div class="sidebar-empty">
            <ion-icon name="chatbubbles-outline"></ion-icon>
            <span>Нет чатов</span>
        </div>
    </div>

    <!-- СПИСОК ПОЛЬЗОВАТЕЛЕЙ (мобильная версия, скрыт по умолчанию) -->
    <div class="sidebar-list hidden" id="sidebarUsersList">
        <div class="sidebar-empty">
            <ion-icon name="people-outline"></ion-icon>
            <span>Нет пользователей</span>
        </div>
    </div>

    <!-- Нижняя панель -->
    <div class="sidebar-footer">
        <div class="sidebar-footer-item" id="profileMenuItem">
            <ion-icon name="person-circle-outline"></ion-icon>
            <span>Профиль</span>
        </div>
        <div class="sidebar-footer-item" id="settingsMenuItem">
            <ion-icon name="settings-outline"></ion-icon>
            <span>Настройки</span>
        </div>
        <div class="sidebar-footer-item" id="exitMenuItem">
            <ion-icon name="log-out-outline"></ion-icon>
            <span>Выход</span>
        </div>
    </div>
</div>

<!-- ============================================================================
     5. ПОДКЛЮЧЕНИЕ JAVASCRIPT
     ============================================================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/app.js"></script>
</body>
</html>
