<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0084ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Messenger">
    <title>Messenger-app</title>
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="src/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
</head>
<body>

<!-- 1. ВХОД -->
<div class="container login">
    <h2>Войти</h2>
    <input type="email" id="loginUsername" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Пароль">
    <button id="enterBtn">Войти</button>
    <a href="#">Забыли пароль?</a>
    <a id="register" href="#">Регистрация</a>
</div>

<!-- 2. РЕГИСТРАЦИЯ -->
<div class="container register close">
    <h2>Регистрация</h2>
    <input type="text" id="regUsername" placeholder="Имя">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Пароль">
    <button id="regBtn">Зарегистрироваться</button>
    <a href="#">Забыли пароль?</a>
    <a id="login" href="#">Войти</a>
</div>

<!-- 3. ЧАТ -->
<div class="container chat close">
    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <div id="chats">
        <div class="navBar">
            <div class="chats-title">Мессенджер</div>
        </div>
        <div class="search-box">
            <ion-icon name="search-outline"></ion-icon>
            <input type="text" id="searchInput" placeholder="Поиск пользователей...">
        </div>
        <div class="tabs">
            <div class="tab active" data-tab="chats">Чаты</div>
            <div class="tab" data-tab="users">Пользователи</div>
        </div>
        <div class="list-container" id="chatsList"></div>
        <div class="list-container hidden" id="usersListContainer"></div>
        <!-- ДЕСКТОПНЫЙ ФУТЕР (виден на ПК) -->
        <div class="desktop-footer">
            <div class="desktop-footer-item" id="profileDesktopBtn">
                <ion-icon name="person-circle-outline"></ion-icon>
                <span>Профиль</span>
            </div>
            <div class="desktop-footer-item" id="settingsDesktopBtn">
                <ion-icon name="settings-outline"></ion-icon>
                <span>Настройки</span>
            </div>
            <div class="desktop-footer-item" id="exitDesktopBtn">
                <ion-icon name="log-out-outline"></ion-icon>
                <span>Выход</span>
            </div>
        </div>

        <!-- МОБИЛЬНЫЙ ФУТЕР (виден на телефоне) -->
        <div class="mobile-footer">
            <div class="mobile-footer-item" id="mobileProfileBtn">
                <ion-icon name="person-circle-outline"></ion-icon>
                <span>Профиль</span>
            </div>
            <div class="mobile-footer-item" id="mobileSettingsBtn">
                <ion-icon name="settings-outline"></ion-icon>
                <span>Настройки</span>
            </div>
            <div class="mobile-footer-item" id="mobileExitBtn">
                <ion-icon name="log-out-outline"></ion-icon>
                <span>Выход</span>
            </div>
        </div>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <div id="messager">
        <div class="navBar">
            <div style="display:flex;align-items:center;">
                <button class="mobile-back-btn" id="mobileBackBtn">
                    <ion-icon name="arrow-back-outline"></ion-icon>
                </button>

                <div class="chat-title" id="currentChatTitle">
                    Выберите чат
                </div>
            </div>
            <div class="profile-icon"><ion-icon name="person-circle-outline"></ion-icon></div>
        </div>

        <div class="empty-chat-screen" id="emptyChatScreen">
            <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
            <h2>Выберите чат</h2>
            <p>Выберите диалог из списка слева</p>
        </div>

        <div id="messageText" class="hidden"></div>

        <div class="input">
            <div class="attach-wrapper">
                <button id="attachBtn" class="attach-btn"><ion-icon name="attach-outline"></ion-icon></button>
                <div class="attach-menu" id="attachMenu" style="display: none;">
                    <button id="attachPhotoBtn" class="attach-menu-item"><ion-icon name="camera-outline"></ion-icon><span>Фото</span></button>
                    <button id="attachFileBtn" class="attach-menu-item"><ion-icon name="document-outline"></ion-icon><span>Файл</span></button>
                </div>
            </div>
            <button id="emojiBtn" class="emoji-btn"><ion-icon name="happy-outline"></ion-icon></button>
            <div class="message-input-wrapper">
                <textarea id="message" placeholder="Введите сообщение..." autocomplete="off"></textarea>
                <div class="emoji-picker" id="emojiPicker" style="display: none;">
                    <div class="emoji-list">
                        <span>😀</span><span>😃</span><span>😄</span><span>😁</span><span>😆</span>
                        <span>😅</span><span>😂</span><span>🤣</span><span>😊</span><span>😇</span>
                        <span>🙂</span><span>🙃</span><span>😉</span><span>😌</span><span>😍</span>
                        <span>🥰</span><span>😘</span><span>😗</span><span>😙</span><span>😚</span>
                        <span>❤️</span><span>💛</span><span>💚</span><span>💙</span><span>💜</span>
                        <span>👍</span><span>👎</span><span>👊</span><span>✌️</span><span>🤘</span>
                    </div>
                </div>
                <div class="input-char-counter" id="charCounter"></div>
            </div>
            <button id="sendBtn" class="send-btn"><ion-icon name="send-outline"></ion-icon></button>
        </div>

        <input type="file" id="photoInput" accept="image/*" style="display: none">
        <input type="file" id="fileInput" style="display: none">

        <div class="photo-viewer" id="photoViewer" style="display: none;">
            <div class="photo-viewer-content">
                <button class="photo-viewer-close" id="photoViewerClose"><ion-icon name="close-outline"></ion-icon></button>
                <img id="photoViewerImg" src="" alt="">
            </div>
        </div>
    </div>
</div>

<!-- 5. СКРИПТЫ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/app.js"></script>
</body>
</html>
