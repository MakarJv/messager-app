<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover"
          name="viewport">
    <link href="manifest.json" rel="manifest">
    <meta content="#0084ff" name="theme-color">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
    <meta content="Messenger" name="apple-mobile-web-app-title">
    <title>Messenger-app</title>
    <script src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js" type="module"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link href="src/style.css" rel="stylesheet">
    <link href="manifest.json" rel="manifest">
    <link href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>"
          rel="icon">
</head>
<body>

<!-- Глобальный лоадер страницы -->
<div class="page-loader" id="pageLoader">
    <div class="loader-container">
        <div class="loader-spinner">
            <div class="loader-logo">💬</div>
        </div>
        <div class="loader-text">
            Загрузка мессенджера
            <div class="loader-dots">
                <span>.</span><span>.</span><span>.</span>
            </div>
        </div>
    </div>
</div>

<!-- Полноэкранный лоадер для действий -->
<div class="fullscreen-loader" id="fullscreenLoader">
    <div class="loader-card">
        <div class="loader-spinner-small"></div>
        <div class="loader-text" id="fullscreenLoaderText">Загрузка...</div>
    </div>
</div>

<!-- 1. ВХОД -->
<div class="container login">
    <h2>Войти</h2>
    <input id="loginUsername" placeholder="Email" type="email">
    <input id="loginPassword" placeholder="Пароль" type="password">
    <button id="enterBtn">Войти</button>
    <a href="#">Забыли пароль?</a>
    <a href="#" id="register">Регистрация</a>
</div>

<!-- 2. РЕГИСТРАЦИЯ -->
<div class="container register close">
    <h2>Регистрация</h2>
    <input id="regUsername" placeholder="Имя" type="text">
    <input id="regEmail" placeholder="Email" type="email">
    <input id="regPassword" placeholder="Пароль" type="password">
    <button id="regBtn">Зарегистрироваться</button>
    <a href="#">Забыли пароль?</a>
    <a href="#" id="login">Войти</a>
</div>

<!-- 3. ЧАТ (основной интерфейс) -->
<div class="container chat close">
    <!-- ЛЕВАЯ ПАНЕЛЬ: список чатов, пользователи, поиск, футер -->
    <div id="chats">
        <div class="navBar">
            <div class="chats-title">Мессенджер</div>
        </div>
        <div class="search-box">
            <ion-icon name="search-outline"></ion-icon>
            <input id="searchInput" placeholder="Поиск пользователей..." type="text">
        </div>
        <div class="tabs">
            <div class="tab active" data-tab="chats">Чаты</div>
            <div class="tab" data-tab="users">Пользователи</div>
        </div>
        <div class="list-container" id="chatsList"></div>
        <div class="list-container hidden" id="usersListContainer"></div>
        <!-- Десктопный футер (ПК) -->
        <div class="desktop-footer">
            <div class="desktop-footer-item" id="profileDesktopBtn">
                <ion-icon name="person-circle-outline"></ion-icon>
                <span>Профиль</span></div>
            <div class="desktop-footer-item" id="settingsDesktopBtn">
                <ion-icon name="settings-outline"></ion-icon>
                <span>Настройки</span></div>
            <div class="desktop-footer-item" id="exitDesktopBtn">
                <ion-icon name="log-out-outline"></ion-icon>
                <span>Выход</span></div>
        </div>
        <!-- Мобильный футер (телефон) -->
        <div class="mobile-footer">
            <div class="mobile-footer-item" id="mobileProfileBtn">
                <ion-icon name="person-circle-outline"></ion-icon>
                <span>Профиль</span></div>
            <div class="mobile-footer-item" id="mobileSettingsBtn">
                <ion-icon name="settings-outline"></ion-icon>
                <span>Настройки</span></div>
            <div class="mobile-footer-item" id="mobileExitBtn">
                <ion-icon name="log-out-outline"></ion-icon>
                <span>Выход</span></div>
        </div>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ: активный чат, сообщения, ввод -->
    <div id="messager">
        <div class="navBar">
            <div style="display:flex;align-items:center;">
                <button class="mobile-back-btn" id="mobileBackBtn">
                    <ion-icon name="arrow-back-outline"></ion-icon>
                </button>
                <div class="chat-title" id="currentChatTitle">Выберите чат</div>
            </div>
            <div class="profile-icon">
                <ion-icon name="person-circle-outline"></ion-icon>
            </div>
        </div>
        <div class="empty-chat-screen" id="emptyChatScreen">
            <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
            <h2>Выберите чат</h2>
            <p>Выберите диалог из списка слева</p>
        </div>
        <div class="hidden" id="messageText"></div>
        <div class="input">
            <div class="attach-wrapper">
                <button class="attach-btn" id="attachBtn">
                    <ion-icon name="attach-outline"></ion-icon>
                </button>
                <div class="attach-menu" id="attachMenu" style="display: none;">
                    <button class="attach-menu-item" id="attachPhotoBtn">
                        <ion-icon name="camera-outline"></ion-icon>
                        <span>Фото</span></button>
                    <button class="attach-menu-item" id="attachFileBtn">
                        <ion-icon name="document-outline"></ion-icon>
                        <span>Файл</span></button>
                </div>
            </div>
            <button class="emoji-btn" id="emojiBtn">
                <ion-icon name="happy-outline"></ion-icon>
            </button>
            <div class="message-input-wrapper">
                <textarea autocomplete="off" id="message" placeholder="Введите сообщение..."></textarea>
                <div class="emoji-picker" id="emojiPicker" style="display: none;">
                    <div class="emoji-list">
                        <span>😀</span><span>😃</span><span>😄</span><span>😁</span><span>😆</span>
                        <span>😅</span><span>😂</span><span>🤣</span><span>😊</span><span>😇</span>
                        <span>🙂</span><span>🙃</span><span>😉</span><span>😌</span><span>😍</span>
                        <span>🥰</span><span>😘</span><span>😗</span><span>😙</span><span>😚</span>
                        <span>❤️</span><span>💛</span><span>💚</span><span>💙</span><span>💜</span>
                        <span>👍</span><span>👎</span><span>👊</span><span>✌️</span><span>🤘</span>
                    </div>
                </div>
                <div class="input-char-counter" id="charCounter"></div>
            </div>
            <button class="send-btn" id="sendBtn">
                <ion-icon name="send-outline"></ion-icon>
            </button>
        </div>
        <input accept="image/*" id="photoInput" style="display: none" type="file">
        <input id="fileInput" style="display: none" type="file">
        <div class="photo-viewer" id="photoViewer" style="display: none;">
            <div class="photo-viewer-content">
                <button class="photo-viewer-close" id="photoViewerClose">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
                <img alt="" id="photoViewerImg" src="">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/app.js"></script>
</body>
</html>
