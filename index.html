<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0,
     maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>Messenger-app</title>
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

<!-- 1. ВХОД -->
<div class="container login">
    <h2>Войти</h2>
    <input type="email" id="loginUsername" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Пароль">
    <button id="enterBtn">Войти</button>
    <a href="#">Забыли пароль?</a>
    <a id="register" href="#">Регистрация</a>
</div>

<!-- 2. РЕГИСТРАЦИЯ -->
<div class="container register close">
    <h2>Регистрация</h2>
    <input type="text" id="regUsername" placeholder="Имя">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Пароль">
    <button id="regBtn">Зарегистрироваться</button>
    <a href="#">Забыли пароль?</a>
    <a id="login" href="#">Войти</a>
</div>

<!-- 3. ЧАТ -->
<div class="container chat close">
    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <div id="chats">
        <div class="navBar">
            <div class="chats-title">Мессенджер</div>
        </div>
        <div class="search-box">
            <ion-icon name="search-outline"></ion-icon>
            <input type="text" id="searchInput" placeholder="Поиск пользователей...">
        </div>
        <div class="tabs">
            <div class="tab active" data-tab="chats">Чаты</div>
            <div class="tab" data-tab="users">Пользователи</div>
        </div>
        <div class="list-container" id="chatsList">
            <!-- чаты -->
        </div>
        <div class="list-container hidden" id="usersListContainer">
            <!-- пользователи -->
        </div>
        <div class="desktop-footer">
            <div class="desktop-footer-item" id="profileDesktopBtn">
                <ion-icon name="person-circle-outline"></ion-icon>
                <span>Профиль</span>
            </div>
            <div class="desktop-footer-item" id="settingsDesktopBtn">
                <ion-icon name="settings-outline"></ion-icon>
                <span>Настройки</span>
            </div>
            <div class="desktop-footer-item" id="exitDesktopBtn">
                <ion-icon name="log-out-outline"></ion-icon>
                <span>Выход</span>
            </div>
        </div>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <div id="messager">
        <div class="navBar">
            <div class="menu-btn close" id="menuBtnMobile"><ion-icon name="menu-outline"></ion-icon></div>
            <div class="chat-title" id="currentChatTitle">Общий чат</div>
            <div class="profile-icon"><ion-icon name="person-circle-outline"></ion-icon></div>
        </div>
        <div id="messageText"></div>
        <div class="input">
            <div class="attach-wrapper">
                <button id="attachBtn" class="attach-btn"><ion-icon name="attach-outline"></ion-icon></button>
                <div class="attach-menu" id="attachMenu" style="display: none;">
                    <button id="attachPhotoBtn" class="attach-menu-item"><ion-icon name="camera-outline"></ion-icon><span>Фото</span></button>
                    <button id="attachFileBtn" class="attach-menu-item"><ion-icon name="document-outline"></ion-icon><span>Файл</span></button>
                </div>
            </div>
            <div class="message-input-wrapper">
                <textarea id="message" placeholder="Введите сообщение..." autocomplete="off"></textarea>
                <div class="input-char-counter" id="charCounter"></div>
            </div>
            <button id="sendBtn" class="send-btn"><ion-icon name="send-outline"></ion-icon></button>
        </div>

        <input type="file" id="photoInput" accept="image/*" style="display: none">
        <input type="file" id="fileInput" style="display: none">

        <div class="photo-viewer" id="photoViewer" style="display: none;">
            <div class="photo-viewer-content">
                <button class="photo-viewer-close" id="photoViewerClose"><ion-icon name="close-outline"></ion-icon></button>
                <img id="photoViewerImg" src="" alt="">
            </div>
        </div>
    </div>
</div>

<!-- 4. БОКОВОЕ МЕНЮ -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <ion-icon name="chatbubbles-outline"></ion-icon><span>Мессенджер</span>
        <button class="sidebar-close-btn" id="sidebarCloseBtn"><ion-icon name="close-outline"></ion-icon></button>
    </div>
    <div class="sidebar-search">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" id="sidebarSearchInput" placeholder="Поиск...">
    </div>
    <div class="sidebar-tabs">
        <div class="sidebar-tab active" data-tab="chats"><ion-icon name="chatbubbles-outline"></ion-icon><span>Чаты</span></div>
        <div class="sidebar-tab" data-tab="users"><ion-icon name="people-outline"></ion-icon><span>Люди</span></div>
    </div>
    <div class="sidebar-list" id="sidebarChatsList"><div class="sidebar-empty"><ion-icon name="chatbubbles-outline"></ion-icon><span>Нет чатов</span></div></div>
    <div class="sidebar-list hidden" id="sidebarUsersList"><div class="sidebar-empty"><ion-icon name="people-outline"></ion-icon><span>Нет пользователей</span></div></div>
    <div class="sidebar-footer">
        <div class="sidebar-footer-item" id="profileMenuItem"><ion-icon name="person-circle-outline"></ion-icon><span>Профиль</span></div>
        <div class="sidebar-footer-item" id="settingsMenuItem"><ion-icon name="settings-outline"></ion-icon><span>Настройки</span></div>
        <div class="sidebar-footer-item" id="exitMenuItem"><ion-icon name="log-out-outline"></ion-icon><span>Выход</span></div>
    </div>
</div>

<!-- 5. СКРИПТЫ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/app.js"></script>
</body>
</html>
